<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>样鞋下单 · Flowboard</title>
  <link rel="stylesheet" href="/sample-orders.css">
  <script src="/sample-orders.js" defer></script>

<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">样</span><div><strong>样鞋下单</strong><small>Flowboard · 共享工作区</small></div></div>
