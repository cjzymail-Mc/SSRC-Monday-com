<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>旗帜悬浮 · 显示效果样张</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f5f6fa;color:#28364e;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.55}
    button,input{font:inherit}
    button{cursor:pointer}
    main{max-width:1120px;margin:28px auto;padding:0 28px 24px}
    .intro{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:20px}
    h1{margin:0;font-size:23px;letter-spacing:.02em;font-weight:650}
    .intro p{margin:7px 0 0;color:#798397;font-size:13px}
    .sample-label{flex:none;margin-top:5px;border:1px solid #dfe4ed;border-radius:6px;padding:4px 9px;background:#fff;color:#8791a2;font-size:11px}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
    .scenarios{display:flex;gap:3px;padding:3px;border:1px solid #e0e4ed;background:#eceff5;border-radius:8px}
    .scenarios button{border:0;background:none;color:#788296;padding:6px 14px;border-radius:5px;font-size:12px}
    .scenarios button[aria-pressed="true"]{background:#fff;color:#35435c;box-shadow:0 1px 4px #34415b12}
    .pin-label{display:flex;gap:7px;align-items:center;color:#6f7b8e;font-size:12px;cursor:pointer;white-space:nowrap}
    input[type="checkbox"]{accent-color:#6173a0;width:14px;height:14px;margin:0}
    .variants{display:grid;grid-template-columns:1fr 1fr;gap:20px}
    .variant{border:1px solid #dfe5ee;border-radius:13px;background:#fff;overflow:hidden;box-shadow:0 3px 12px #2d3c5a04}
    .variant-head{padding:17px 19px 15px;display:flex;gap:11px;align-items:flex-start}
    .letter{display:grid;place-items:center;flex:none;width:27px;height:27px;border-radius:7px;background:#f0f3f8;color:#6a7991;font-size:12px;font-weight:600}
    h2{font-size:15px;font-weight:600;margin:0}
    .variant-head p{font-size:12px;color:#8791a2;margin:3px 0 0}
    .suggestion{display:inline-block;margin-left:7px;padding:1px 6px;border-radius:4px;background:#edf1f9;color:#7384a5;font-size:10px;font-weight:400;vertical-align:1px}
    .canvas{position:relative;height:222px;margin:0 16px 16px;border:1px solid #e7ecf4;border-radius:8px;background:#f7faff}
    .canvas-caption{position:absolute;top:14px;left:17px;color:#a0aaba;font-size:11px}
    .timeline-track{position:absolute;left:22px;right:22px;bottom:61px;height:6px;background:linear-gradient(to right,#ad7fea 0%,#ad7fea 53%,#1746b0 53%,#1746b0 78%,#00a589 78%);border-radius:3px;opacity:.62}
    .track-name{position:absolute;left:22px;bottom:75px;color:#b29bd0;font-size:10px}
    .node{position:absolute;left:12%;bottom:58px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#ad7fea;border:2px solid #fff;box-shadow:0 0 0 1px #ad7fea35}
    .node.secondary{left:72%;background:#1746b0;box-shadow:0 0 0 1px #1746b025}
    .flag-hit{position:absolute;left:12%;bottom:75px;display:block;width:110px;height:38px;border:0;padding:0;background:transparent;z-index:3;text-align:left;color:#32405a;cursor:default;-webkit-tap-highlight-color:transparent}
    .flag-hit::after{content:"";position:absolute;left:0;top:100%;width:1px;height:11px;border-left:1px dashed #9aa5b6;pointer-events:none}
    .small-flag,.large-flag{position:absolute;left:0;bottom:0;display:block;transform-origin:left bottom;border-left:3px solid #8b96a8;border-radius:0 5px 5px 0;background:#fff;box-shadow:0 3px 11px #1f304c1f;transform:rotate(-8deg)}
    .small-flag{width:110px;height:38px;padding:6px 7px 6px 6px;transition:opacity 80ms}
    .small-title{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;line-height:14px;font-weight:600}
    .small-date{display:block;color:#8a95a6;font-size:8px;line-height:10px;margin-top:1px;font-variant-numeric:tabular-nums}
    .large-flag{display:grid;grid-template-rows:16px 12px 28px;row-gap:2px;width:220px;height:76px;padding:8px 9px 8px 8px;border-left-width:4px;box-shadow:0 4px 12px #273c601a;opacity:0;visibility:hidden;pointer-events:none;transform:rotate(var(--open-angle,-8deg));transition:opacity 120ms,transform 150ms}
    .large-title{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px;font-weight:600;line-height:16px}
    .large-date{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#8c96a7;font-size:9px;line-height:12px;font-variant-numeric:tabular-nums}
    .note{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;height:28px;color:#627089;font-size:10.5px;line-height:14px;white-space:normal;overflow-wrap:anywhere}
    .note.is-empty{color:#a0a9b7}
    .flag-hit.is-open{z-index:10}
    .flag-hit.is-open .small-flag{opacity:0;visibility:hidden}
    .flag-hit.is-open .large-flag{opacity:1;visibility:visible;pointer-events:auto}
    .flag-hit:focus-visible{outline:none}
    .flag-hit:focus-visible .large-flag{box-shadow:0 0 0 2px #8c9fc555,0 5px 20px #273c6020}
    .neighbor{position:absolute;left:72%;bottom:75px;width:88px;padding:5px 7px;border-left:3px solid #bac3d1;border-radius:0 4px 4px 0;transform:rotate(-8deg);transform-origin:left bottom;background:#fff;color:#8c97a8;box-shadow:0 3px 9px #1f304c10;opacity:.65;pointer-events:none}
    .neighbor b{display:block;font-weight:500;font-size:9px}.neighbor small{display:block;font-size:8px;margin-top:1px}
    .baseline-label{position:absolute;left:16px;right:16px;bottom:17px;color:#a4adbb;font-size:10px;text-align:center;letter-spacing:.04em}
    .foot{margin:17px 0 0;text-align:center;color:#8c96a7;font-size:12px}
    @media(max-width:800px){main{padding:0 18px;margin:22px auto}.variants{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}.intro{gap:10px}.intro h1{font-size:21px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
<main id="flag-hover-sample">
  <header class="intro">
    <div><h1>2 倍旗帜 · 固定排版</h1><p>宽、高各为原来的 2 倍；名称和日期各一行，备注最多两行，超出显示省略号。</p></div>
    <span class="sample-label">显示效果样张</span>
  </header>
  <div class="toolbar">
    <div class="scenarios" role="group" aria-label="备注样例">
      <button type="button" data-scenario="short" aria-pressed="true">短备注</button>
      <button type="button" data-scenario="long" aria-pressed="false">长备注</button>
      <button type="button" data-scenario="empty" aria-pressed="false">无备注</button>
    </div>
    <label class="pin-label"><input id="keep-open" type="checkbox" checked>保持展开，方便比较</label>
  </div>
  <div class="variants">
    <section class="variant" data-variant="a">
      <header class="variant-head"><span class="letter">A</span><div><h2>保留原倾角</h2><p>沿用原来的 8°，像把同一面旗帜放大。</p></div></header>
      <div class="canvas">
        <span class="canvas-caption">凌云竞速跑鞋 · 轻量款</span>
        <span class="timeline-track" aria-hidden="true"></span><span class="track-name" aria-hidden="true">创意</span>
        <span class="node" aria-hidden="true"></span><span class="node secondary" aria-hidden="true"></span>
        <span class="neighbor" aria-hidden="true"><b>设计定稿</b><small>2026-09-18</small></span>
        <button type="button" class="flag-hit is-open" aria-label="预览项目立项旗帜，方案 A" aria-expanded="true">
          <span class="small-flag" aria-hidden="true"><span class="small-title">项目立项</span><span class="small-date">2026-07-02</span></span>
          <span class="large-flag"><span class="large-title">项目立项</span><span class="large-date">2026-07-02 · 创意</span><span class="note"></span></span>
        </button>
        <span class="baseline-label">锚点不动 · 不改变项目行高</span>
      </div>
    </section>
    <section class="variant" data-variant="b" style="--open-angle:-3deg">
      <header class="variant-head"><span class="letter">B</span><div><h2>展开时略微扶正<span class="suggestion">建议</span></h2><p>展开后改为 3°，长备注更容易阅读。</p></div></header>
      <div class="canvas">
        <span class="canvas-caption">凌云竞速跑鞋 · 轻量款</span>
        <span class="timeline-track" aria-hidden="true"></span><span class="track-name" aria-hidden="true">创意</span>
        <span class="node" aria-hidden="true"></span><span class="node secondary" aria-hidden="true"></span>
        <span class="neighbor" aria-hidden="true"><b>设计定稿</b><small>2026-09-18</small></span>
        <button type="button" class="flag-hit is-open" aria-label="预览项目立项旗帜，方案 B" aria-expanded="true">
          <span class="small-flag" aria-hidden="true"><span class="small-title">项目立项</span><span class="small-date">2026-07-02</span></span>
          <span class="large-flag"><span class="large-title">项目立项</span><span class="large-date">2026-07-02 · 创意</span><span class="note"></span></span>
        </button>
        <span class="baseline-label">锚点不动 · 不改变项目行高</span>
      </div>
    </section>
  </div>
  <p class="foot">取消“保持展开”，将鼠标移到小旗帜上体验。样例文字仅用于效果比较。</p>
</main>
<script>
(() => {
  const root = document.getElementById('flag-hover-sample');
  const pin = root.querySelector('#keep-open');
  const flags = [...root.querySelectorAll('.flag-hit')];
  const samples = {
    short: {title:'项目立项',note:'确认目标客群与价格带，鞋面与鞋底方案同步启动。'},
    long: {title:'项目立项与首轮研发方向确认',note:'首轮评审聚焦鞋楦包裹、前掌回弹和整鞋重量。\n鞋面先比较两种网布方案，鞋底同步确认模具周期。待设计与工厂反馈齐备后，再安排下一轮样鞋评审。'},
    empty: {title:'项目立项',note:''}
  };
  const setOpen = (flag, value) => {
    flag.classList.toggle('is-open',value);
    flag.setAttribute('aria-expanded',String(value));
    flag.querySelector('.large-flag').setAttribute('aria-hidden',String(!value));
  };
  flags.forEach(flag => {
    let enterTimer,leaveTimer;
    flag.addEventListener('pointerenter',() => {clearTimeout(leaveTimer);enterTimer=setTimeout(() => setOpen(flag,true),160)});
    flag.addEventListener('pointerleave',() => {clearTimeout(enterTimer);leaveTimer=setTimeout(() => {if(!pin.checked&&document.activeElement!==flag)setOpen(flag,false)},100)});
    flag.addEventListener('focus',() => setOpen(flag,true));
    flag.addEventListener('blur',() => {if(!pin.checked)setOpen(flag,false)});
    flag.addEventListener('keydown',event => {if(event.key==='Escape'){clearTimeout(enterTimer);clearTimeout(leaveTimer);pin.checked=false;flags.forEach(item=>setOpen(item,false));flag.blur()}});
  });
  pin.addEventListener('change',() => flags.forEach(flag=>setOpen(flag,pin.checked)));
  const selectSample = key => {
    const sample=samples[key];
    root.querySelectorAll('[data-scenario]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.scenario===key)));
    flags.forEach((flag,index)=>{
      flag.querySelector('.small-title').textContent=sample.title;
      flag.querySelector('.large-title').textContent=sample.title;
      flag.setAttribute('aria-label',`预览${sample.title}旗帜，方案 ${index===0?'A':'B'}`);
      const note=flag.querySelector('.note');note.textContent=sample.note||'暂无备注';note.classList.toggle('is-empty',!sample.note);
    });
  };
  root.querySelectorAll('[data-scenario]').forEach(button=>button.addEventListener('click',()=>selectSample(button.dataset.scenario)));
  selectSample('short');
})();
</script>
</body>
</html>
